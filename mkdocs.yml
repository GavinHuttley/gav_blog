site_name: Gav's Blog
site_url: https://gavinhuttley.dev
site_author: Gavin Huttley
site_description: Doing Science with Computers — notes from Gavin Huttley.
copyright: Copyright &copy; 2022– Gavin Huttley

repo_url: https://github.com/GavinHuttley/gav_blog
repo_name: GavinHuttley/gav_blog
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: en
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GavinHuttley
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - privacy
  - blog:
      blog_dir: .
      blog_toc: true
      post_url_format: "posts/{slug}"
      post_excerpt: optional
      post_date_format: medium
      archive: true
      archive_url_format: "archive/{date}"
      categories: true
      categories_url_format: "category/{slug}"
      authors_file: "{blog}/.authors.yml"
  - tags
  - rss:
      match_path: "posts/.*"
      date_from_meta:
        as_creation: date
      categories:
        - categories
        - tags
      use_git: false
      feeds_filenames:
        rss_created: blag/atom.xml
        rss_updated: blag/feed_updated.xml

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

nav:
  - Blog: index.md
  - About: about.md
not_in_nav: |
  blag/index.md
